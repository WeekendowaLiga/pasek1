<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><title>Generator paska LAP</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f4f6;--fg:#15151a;--card:#fff;--bd:#d8d8de}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101014;--fg:#eee;--card:#1b1b22;--bd:#33333d}}
:root[data-theme="dark"]{--bg:#101014;--fg:#eee;--card:#1b1b22;--bd:#33333d}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Titillium Web',Arial,sans-serif}
.wrap{display:flex;flex-wrap:wrap;gap:20px;padding:20px;max-width:1200px;margin:auto}
.panel{flex:1 1 280px;max-width:360px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;align-self:flex-start}
.view{flex:3 1 480px;min-width:0}
canvas{width:100%;height:auto;border-radius:8px;display:block;background:repeating-conic-gradient(#8885 0 25%,#0000 0 50%) 0 0/24px 24px}
label{font-size:13px;opacity:.75}
input,select{width:100%;box-sizing:border-box;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit}
input[type=color]{padding:2px;height:40px}input[type=checkbox]{width:auto}
button{padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
button.main{background:#d90000;color:#fff;border:0;font-weight:bold}
.row{display:flex;gap:10px}.row>*{flex:1}
small{opacity:.65;font-size:12px}
.authbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--bd);box-shadow:0 4px 18px #0002}
.authbar-title{font-weight:700;letter-spacing:.5px}.authbar-actions{display:flex;align-items:center;gap:8px}.auth-status{font-size:12px;opacity:.7;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auth-btn{padding:8px 12px;border-radius:8px;font-weight:700}.auth-btn.login{background:#15151a;color:#fff;border-color:#15151a}.auth-btn.logout{background:#d90000;color:#fff;border-color:#d90000}
.admin-only{display:none}.admin-only.visible{display:block}.admin-setting{padding:10px 12px;border:1px dashed var(--bd);border-radius:8px;background:color-mix(in srgb,var(--card) 92%,#d90000 8%)}
.auth-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.82);backdrop-filter:blur(8px)}
.auth-overlay.open{display:flex}.auth-card{width:min(440px,100%);background:var(--card);color:var(--fg);border-top:8px solid #d90000;border-radius:12px;padding:26px;box-shadow:0 30px 80px #0008}.auth-card h2{margin:0 0 18px;text-align:center;letter-spacing:2px}.auth-card .form-group{margin-bottom:10px}.auth-card .auth-error{min-height:18px;color:#e10600;font-size:12px;margin:8px 0}.auth-card .auth-buttons{display:flex;gap:10px}.auth-card .auth-buttons>*{flex:1}
@media(max-width:620px){.authbar{padding:8px 10px}.authbar-title{font-size:14px}.auth-status{display:none}.wrap{padding:12px}.auth-btn{padding:7px 9px}}
</style></head><body>
<div class="authbar">
 <div class="authbar-title">Generator paska LAP</div>
 <div class="authbar-actions">
  <span class="auth-status" id="authStatus">Niezalogowany</span>
  <button class="auth-btn login" id="loginBtn" type="button">🔒 Zaloguj</button>
  <button class="auth-btn logout" id="logoutBtn" type="button" style="display:none">Wyloguj</button>
 </div>
</div>
<div id="authModal" class="auth-overlay" aria-hidden="true">
 <div class="auth-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <h2 id="authTitle">AUTORYZACJA</h2>
  <div class="form-group"><input type="email" id="authEmail" autocomplete="username" placeholder="Adres e-mail"></div>
  <div class="form-group"><input type="password" id="authPass" autocomplete="current-password" placeholder="Hasło"></div>
  <div class="auth-error" id="authError"></div>
  <div class="auth-buttons">
   <button class="main" id="authSubmit" type="button">ZALOGUJ SIĘ</button>
   <button id="authCancel" type="button">ANULUJ</button>
  </div>
 </div>
</div>
<div class="wrap">
 <div class="panel">
  <div><label>Tryb</label><select id="mode"><option value="lap">Okrążenie (LAP)</option><option value="sc">SC – Safety Car (żółty)</option><option value="vsc">VSC – Virtual Safety Car (żółty)</option><option value="gf">GREEN FLAG (zielony)</option></select></div>
  <div><label>Napis w kolorowym bloku (tryb LAP)</label><input id="lap" value="LAP 1"></div>
  <div><label>Podtytuł</label><input id="sub" value="SAO PAULO GP"></div>
  <div class="row">
   <div><label>Kolor</label><input type="color" id="col" value="#e10600"></div>
   <div><label>Pozycja</label><select id="pos"><option value="bottom">Dół</option><option value="top">Góra</option></select></div>
  </div>
  <div><label>Czas wyświetlania: <span id="holdv">0:04</span> (maks. 10 min)</label><input type="range" id="hold" min="1" max="600" step="1" value="4"></div>
  <div><label>Czas (mm:ss), np. 05:23</label><input type="text" id="ht" value="00:04" inputmode="numeric" placeholder="05:23" maxlength="5"></div>
  <label><input type="checkbox" id="logoOn" checked> Pokaż logo ligi</label>
  <div class="admin-only admin-setting" id="leagueTextAdmin">
   <label><input type="checkbox" id="leagueTextOn" checked> Pokaż napis „WEEKENDOWA LIGA F1”</label>
   <small>Ta opcja jest dostępna tylko po zalogowaniu.</small>
  </div>
  <button class="main" id="play">▶ Odtwórz animację</button>
  <button class="main" id="mov">Pobierz (.mov, bez tła)</button>
  <small id="info">Zapisuje film .mov z przezroczystym tłem (kodek PNG z kanałem alfa). Renderuje się szybciej niż w czasie rzeczywistym.</small>
 </div>
 <div class="view"><canvas id="c" width="1920" height="1080"></canvas></div>
</div>

function draw(T=1.6){
 const W=1920,H=1080,md=$("mode").value,L0=md==="lap",col=L0?$("col").value:md==="gf"?"#00c85a":"#ffd200",hold=+$("hold").value,ex=true;
 $("lap").disabled=$("col").disabled=!L0;$("holdv").textContent=Math.floor(hold/60)+":"+String(Math.floor(hold%60)).padStart(2,"0");
 if(document.activeElement!==$("ht"))$("ht").value=String(Math.floor(hold/60)).padStart(2,"0")+":"+String(Math.floor(hold%60)).padStart(2,"0");
 ctx.clearRect(0,0,W,H);ctx.textBaseline="alphabetic";ctx.textAlign="left";
 const lap=md==="sc"?"SAFETY CAR":md==="vsc"?"VSC":md==="gf"?"GREEN FLAG":$("lap").value.toUpperCase(),t1=$("leagueTextOn").checked?"WEEKENDOWA LIGA F1":"",t2=$("sub").value.toUpperCase();
 const lo=$("logoOn").checked,lgW=lo?220:0,bh=130,bx0=120,bx=bx0+lgW,by=$("pos").value==="top"?90:H-90-bh;
 ctx.font="italic 700 68px "+F;const lw=Math.max(240,ctx.measureText(lap).width+90);
 let tw=0;
 if(t1&&t2){
  ctx.font="italic 700 56px "+F;const t1w=ctx.measureText(t1).width;
  ctx.font="italic 700 34px "+F;const t2w=ctx.measureText(t2).width;
  tw=Math.max(t1w,t2w)+90;
 }else if(t1){
  ctx.font="italic 700 56px "+F;tw=ctx.measureText(t1).width+90;
 }else if(t2){
  ctx.font="italic 700 48px "+F;tw=ctx.measureText(t2).width+90;
 }else{
  tw=0;
 }
 const tot=lgW+lw+tw;
 tExit=1.5+hold;total=ex?tExit+1.1:tExit;
 const p1=e3(clamp(T/1)),p2=ex?e3(clamp((T-tExit)/.9)):0,end=bx0+tot,sp=x=>-40+(end+40)*x;
 const R=Math.min(end,sp(p1)),L=Math.max(bx0,sp(p2));
 if(R>L){
  ctx.save();ctx.beginPath();ctx.rect(L,by-60,R-L,bh+120);ctx.clip();
  const o=k=>0;
  if(lo){ctx.fillStyle="#000";ctx.fillRect(bx0,by+bh/2-110,220,220);if(lg.naturalWidth){const w=190,h=w*lg.naturalHeight/lg.naturalWidth;ctx.drawImage(lg,bx0+15,by+bh/2-h/2,w,h)}}
  ctx.fillStyle=col;ctx.fillRect(bx,by,lw,bh);
  const lum=parseInt(col.slice(1,3),16)*.3+parseInt(col.slice(3,5),16)*.59+parseInt(col.slice(5,7),16)*.11;
  ctx.fillStyle=lum>170?"#111":"#fff";ctx.font="italic 700 68px "+F;ctx.textAlign="center";ctx.fillText(lap,bx+lw/2+o(.25),by+bh/2+24);
  ctx.fillStyle="rgba(14,14,20,.8)";ctx.fillRect(bx+lw,by,tw,bh);ctx.fillStyle=col;ctx.fillRect(bx+lw,by+bh-6,tw,6);
  ctx.textAlign="left";ctx.fillStyle="#fff";
  if(t1&&t2){ctx.font="italic 700 56px "+F;ctx.fillText(t1,bx+lw+45+o(.45),by+62);ctx.fillStyle="rgba(255,255,255,.8)";ctx.font="italic 700 34px "+F;ctx.fillText(t2,bx+lw+45+o(.6),by+104)}
  else if(t1){ctx.font="italic 700 56px "+F;ctx.fillText(t1,bx+lw+45+o(.45),by+bh/2+20)}
  else if(t2){ctx.fillStyle="#fff";ctx.font="italic 700 48px "+F;ctx.fillText(t2,bx+lw+45+o(.5),by+bh/2+17)}
  ctx.restore();
 }
 const bar=x=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x-6,by-10);ctx.lineTo(x+24,by-10);ctx.lineTo(x-6,by+bh+10);ctx.lineTo(x-36,by+bh+10);ctx.closePath();ctx.fill()};
 if(p1>0&&p1<.999)bar(sp(p1));
 if(ex&&p2>0&&p2<.999)bar(sp(p2));
}
function play(done){cancelAnimationFrame(raf);const t0=performance.now();
 const loop=()=>{const t=(performance.now()-t0)/1000;if(t<total){draw(t);raf=requestAnimationFrame(loop)}else{draw(ex2()?total+1:1.6);done&&done()}};loop()}
const ex2=()=>true,S=()=>draw();
["lap","sub","col","hold","logoOn","leagueTextOn"].forEach(i=>$(i).addEventListener("input",S));
["pos","mode"].forEach(i=>$(i).addEventListener("change",S));
$("ht").addEventListener("input",()=>{const m=$("ht").value.trim().match(/^(\d{1,2})(?::(\d{0,2}))?$/);if(!m)return;const s=m[2]===undefined?+m[1]:(+m[1])*60+(+m[2]||0);$("hold").value=Math.max(1,Math.min(600,s));draw()});
